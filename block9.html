<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>块9 自检问题+落款</title></head><body style="padding:24px;max-width:800px;"><p style="text-align:center;font-size:20px;color:#111111;margin:0 0 16px;">留给你的三个自检问题</p><p style="font-size:15px;color:#111111;text-align:justify;line-height:1.6;margin:0 0 16px;">1. 我现在正在争的那个位置，如果没有人看见、没有人点赞，我还愿意花同样的时间吗？</p><p style="font-size:15px;color:#111111;text-align:justify;line-height:1.6;margin:0 0 16px;">2. 十年后，我手里会有什么别人拿不走、也不容易被替代的东西？</p><p style="font-size:15px;color:#111111;text-align:justify;line-height:1.6;margin:0 0 16px;">3. 在我所在的领域里，有哪一件事是我相信、而多数同行不相信的？我手里有什么证据？</p><p style="font-size:15px;color:#111111;text-align:justify;line-height:1.6;margin:0 0 16px;">本文依据彼得·蒂尔《从 0 到 1》及相关访谈与课程内容整理，不构成投资建议。</p></body></html>
